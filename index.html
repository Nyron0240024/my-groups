<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d55d9"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>My Groups</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#242238;--muted:#817e92;--line:#eceaf3;--violet:#7058d8;--pale:#f0edff;--green:#16865c;--red:#d34f61;--shadow:0 8px 28px #34265d0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:720px;margin:auto;min-height:100dvh;padding:22px 18px 48px}
header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 26px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:var(--violet);color:white;display:grid;place-items:center;font-size:20px;font-weight:800}.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}.sub{color:var(--muted);font-size:12px;margin-top:2px}
.sync{font-size:11px;color:var(--green);background:#e8f7f0;padding:7px 10px;border-radius:20px}.screen-title{font-size:25px;letter-spacing:-.8px;margin:0 0 5px}.hint{color:var(--muted);margin:0 0 20px;font-size:13px}
.group-list{display:grid;gap:11px}.group-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:var(--shadow)}
.group-card{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;color:inherit}.group-card strong{font-size:16px}.group-meta{font-size:12px;color:var(--muted);margin-top:4px}.arrow{color:#a5a1b4;font-size:22px}
.primary{width:100%;background:var(--violet);color:#fff;padding:14px 16px;border-radius:14px;font-weight:650;margin-top:15px}.secondary{background:var(--pale);color:var(--violet);padding:10px 13px;border-radius:12px;font-weight:600}.back{background:none;color:var(--violet);padding:4px 0;margin:0 0 15px;font-weight:650}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.topline h2{font-size:23px;margin:0;letter-spacing:-.6px}
.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 13px;color:var(--ink);outline:none}.field input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #7058d81c}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section-head h3{font-size:15px;margin:0}.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px;background:#fff;border:1px dashed #dcd8e9;border-radius:15px}
.homework{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff;margin:9px 0}.hw-top{display:flex;justify-content:space-between;gap:10px}.hw-title{font-weight:650}.date{font-size:12px;color:var(--muted);white-space:nowrap}.hw-desc{font-size:13px;color:var(--muted);margin-top:5px;white-space:pre-wrap}.student-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #f1eff6}.student-name{font-size:13px}.marks{display:flex;gap:7px}.mark{width:34px;height:32px;border-radius:10px;background:#f3f2f7;color:#aaa;font-weight:800}.mark.done.active{background:#e5f6ee;color:var(--green)}.mark.miss.active{background:#ffedf0;color:var(--red)}
.small-action{color:var(--violet);background:none;font-size:12px;font-weight:650;padding:5px}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#27243a;color:white;padding:10px 15px;border-radius:12px;font-size:12px;display:none;z-index:10}.loading{padding:70px 20px;text-align:center;color:var(--muted)}.danger{color:var(--red);background:#fff0f1}
@media(min-width:600px){.app{padding-top:34px}.group-list{grid-template-columns:1fr 1fr}}
</style></head>
<body><main class="app">
<header><div class="brand"><div class="logo">M</div><div><h1>My Groups</h1><div class="sub">Учёт занятий и домашних заданий</div></div></div><span class="sync" id="sync">● Подключение</span></header>
<div id="view"><div class="loading">Загрузка приложения…</div></div>
</main><div class="toast" id="toast"></div>
<script>
const SUPABASE_URL = "https://pcyacolrskdtloqxxvya.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_syOVLy2-_Aj2c6F7DNecUw_4140Aa5k";
let db=null, user=null, groups=[], students=[], homeworks=[], marks={}, currentGroup=null, currentHomework=null;
const $=s=>document.querySelector(s);
function toast(s){const t=$("#toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2300)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateLabel(d){return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
async function init(){
 if(SUPABASE_URL.startsWith("YOUR_")){$("#sync").textContent="● Нужна настройка";$("#sync").style.color="#a56b16";$("#view").innerHTML=`<h2 class="screen-title">Почти готово</h2><p class="hint">Подключите бесплатную базу Supabase по инструкции в README, чтобы включить облачное сохранение.</p>`;return}
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const {data,error}=await db.auth.getSession(); if(error) return fail(error);
 if(!data.session){const a=await db.auth.signInAnonymously();if(a.error)return fail(a.error);user=a.data.user}else user=data.session.user;
 $("#sync").textContent="● Облако подключено"; await load(); renderGroups();
}
function fail(e){$("#sync").textContent="● Ошибка синхронизации";$("#view").innerHTML=`<div class="panel">Не удалось подключиться: ${esc(e.message)}<br><br>Проверьте настройки Supabase и интернет.</div>`}
async function load(){
 const [g,s,h,m]=await Promise.all([
 db.from("groups").select("*").order("created_at"),
 db.from("students").select("*").order("created_at"),
 db.from("homeworks").select("*").order("lesson_date",{ascending:false}),
 db.from("marks").select("*")
 ]);
 for(const r of [g,s,h,m])if(r.error)throw r.error;
 groups=g.data;students=s.data;homeworks=h.data;marks=Object.fromEntries(m.data.map(x=>[x.homework_id+":"+x.student_id,x.status]));
}
async function add(table,row){const {error}=await db.from(table).insert({...row,user_id:user.id});if(error)throw error;await load()}
async function updateMark(hw,st,status){const key=hw+":"+st,exists=marks[key];if(exists===status){const {error}=await db.from("marks").delete().eq("homework_id",hw).eq("student_id",st);if(error)throw error}else{const {error}=await db.from("marks").upsert({user_id:user.id,homework_id:hw,student_id:st,status},{onConflict:"homework_id,student_id"});if(error)throw error}await load();renderGroup()}
function renderGroups(){
 currentGroup=null;$("#view").innerHTML=`<h2 class="screen-title">Мои группы</h2><p class="hint">Выберите группу или создайте новую</p>
 <div class="group-list">${groups.map(g=>`<button class="group-card" data-group="${g.id}"><div><strong>${esc(g.name)}</strong><div class="group-meta">${students.filter(s=>s.group_id===g.id).length} учеников</div></div><span class="arrow">›</span></button>`).join("")||`<div class="empty">Групп пока нет. Создайте первую группу.</div>`}</div>
 <button class="primary" id="addGroup">＋ Добавить группу</button>`;
 document.querySelectorAll("[data-group]").forEach(b=>b.onclick=()=>{currentGroup=b.dataset.group;renderGroup()});
 $("#addGroup").onclick=()=>modal("Новая группа",`<div class="field"><label>Название группы</label><input id="newName" placeholder="Например, Beginners A1" maxlength="60"></div>`,`Создать`,async()=>{const name=$("#newName").value.trim();if(!name)return toast("Введите название группы");await add("groups",{name});renderGroups()});
}
function renderGroup(){
 const g=groups.find(x=>x.id===currentGroup);if(!g)return renderGroups();
 const ss=students.filter(s=>s.group_id===g.id), hs=homeworks.filter(h=>h.group_id===g.id);
 $("#view").innerHTML=`<button class="back" id="back">← Все группы</button><div class="topline"><h2>${esc(g.name)}</h2><button class="small-action" id="rename">Изменить</button></div>
 <button class="primary" id="addHw">＋ Добавить домашнее задание</button>
 <div class="section-head"><h3>Ученики <span class="muted">(${ss.length})</span></h3><button class="small-action" id="addStudent">＋ Добавить</button></div>
 ${ss.length?ss.map(s=>`<div class="student-row"><span class="student-name">${esc(s.name)}</span><button class="small-action" data-delstudent="${s.id}">Удалить</button></div>`).join(""):`<div class="empty">Добавьте учеников этой группы</div>`}
 <div class="section-head"><h3>Домашние задания</h3></div>
 ${hs.length?hs.map(h=>`<article class="homework"><div class="hw-top"><div class="hw-title">${esc(h.title)}</div><span class="date">${dateLabel(h.lesson_date)}</span></div>${h.description?`<div class="hw-desc">${esc(h.description)}</div>`:""}<button class="small-action" data-hw="${h.id}">Открыть отметки →</button></article>`).join(""):`<div class="empty">Заданий пока нет</div>`}`;
 $("#back").onclick=renderGroups;
 $("#rename").onclick=()=>modal("Название группы",`<div class="field"><label>Название</label><input id="newName" value="${esc(g.name)}"></div>`,"Сохранить",async()=>{const {error}=await db.from("groups").update({name:$("#newName").value.trim()}).eq("id",g.id);if(error)throw error;await load();renderGroup()});
 $("#addStudent").onclick=()=>modal("Новый ученик",`<div class="field"><label>Имя и фамилия</label><input id="newName" placeholder="Имя Фамилия" maxlength="100"></div>`,"Добавить",async()=>{const name=$("#newName").value.trim();if(!name)return toast("Введите имя");await add("students",{group_id:g.id,name});renderGroup()});
 $("#addHw").onclick=()=>modal("Домашнее задание",`<div class="field"><label>Название задания</label><input id="hwTitle" placeholder="Например, Unit 5 — упражнения"></div><div class="field"><label>Описание (необязательно)</label><input id="hwDesc" placeholder="Страница, упражнения…"></div><div class="field"><label>Дата урока</label><input id="hwDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>`,"Сохранить",async()=>{const title=$("#hwTitle").value.trim(),lesson_date=$("#hwDate").value;if(!title||!lesson_date)return toast("Укажите название и дату");await add("homeworks",{group_id:g.id,title,description:$("#hwDesc").value.trim(),lesson_date});renderGroup()});
 document.querySelectorAll("[data-hw]").forEach(b=>b.onclick=()=>{currentHomework=b.dataset.hw;renderHomework()});
 document.querySelectorAll("[data-delstudent]").forEach(b=>b.onclick=async()=>{if(!confirm("Удалить ученика?"))return;const {error}=await db.from("students").delete().eq("id",b.dataset.delstudent);if(error)return toast(error.message);await load();renderGroup()});
}
function renderHomework(){
 const h=homeworks.find(x=>x.id===currentHomework),g=groups.find(x=>x.id===currentGroup);if(!h)return renderGroup();
 const ss=students.filter(s=>s.group_id===g.id);
 $("#view").innerHTML=`<button class="back" id="back">← ${esc(g.name)}</button><h2 class="screen-title">${esc(h.title)}</h2><p class="hint">${dateLabel(h.lesson_date)} · Отметьте выполнение задания</p>${h.description?`<div class="panel" style="margin-bottom:15px">${esc(h.description)}</div>`:""}
 <div class="panel">${ss.map(s=>{const v=marks[h.id+":"+s.id];return `<div class="student-row"><span class="student-name">${esc(s.name)}</span><div class="marks"><button class="mark done ${v==="done"?"active":""}" data-mark="${s.id}" data-status="done" aria-label="Сделал">＋</button><button class="mark miss ${v==="missed"?"active":""}" data-mark="${s.id}" data-status="missed" aria-label="Не сделал">−</button></div></div>`}).join("")||`<div class="empty">В этой группе пока нет учеников</div>`}</div>`;
 $("#back").onclick=renderGroup;
 document.querySelectorAll("[data-mark]").forEach(b=>b.onclick=async()=>{try{await updateMark(h.id,b.dataset.mark,b.dataset.status)}catch(e){toast(e.message)}});
}
function modal(title,body,action,fn){
 const old=$("#dialog");if(old)old.remove();
 const d=document.createElement("dialog");d.id="dialog";d.style.cssText="border:0;border-radius:20px;padding:22px;width:min(92vw,440px);box-shadow:0 20px 80px #21183b33;color:var(--ink)";
 d.innerHTML=`<form method="dialog"><h3 style="margin:0 0 14px">${title}</h3>${body}<div style="display:flex;gap:8px;margin-top:18px"><button class="secondary" value="cancel" style="flex:1">Отмена</button><button class="primary" id="save" type="button" style="flex:1;margin:0">${action}</button></div></form>`;
 document.body.append(d);d.showModal();d.querySelector("#save").onclick=async()=>{try{await fn();d.close();d.remove();toast("Сохранено")}catch(e){toast(e.message)}};
}
init().catch(fail);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
